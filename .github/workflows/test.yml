name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Açık veri dosyaları güncel mi?
        run: |
          node scripts/acik-veri.mjs
          git diff --exit-code acik-veri || (echo "::error::acik-veri/ güncel değil; 'npm run veri:yayinla' çalıştırıp commit edin" && exit 1)
