name: Veri güncelle

# EGM yeni bülteni ayın sonuna kadar yayımlar; her gün kontrol etmek yayından birkaç saat sonra yakalamayı sağlar.
# Betikler yalnızca yeni dönemleri indirir, veri değişmediyse commit atılmaz.
on:
  schedule:
    - cron: '0 5 * * *' # her gün 08:00 (TSİ): EGM
    - cron: '30 5 * * 1' # pazartesi 08:30 (TSİ): İBB
  workflow_dispatch:
    inputs:
      kaynak:
        description: Hangi kaynak güncellensin?
        type: choice
        options: [egm, ibb, izmir, hepsi]
        default: egm

permissions:
  contents: write
  issues: write
  actions: write # yeni veriden sonra site yayınını tetiklemek için

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EGM: ${{ github.event.schedule == '0 5 * * *' || inputs.kaynak == 'egm' || inputs.kaynak == 'hepsi' }}
      IBB: ${{ github.event.schedule == '30 5 * * 1' || inputs.kaynak == 'ibb' || inputs.kaynak == 'hepsi' }}
      IZMIR: ${{ github.event.schedule == '30 5 * * 1' || inputs.kaynak == 'izmir' || inputs.kaynak == 'hepsi' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: EGM bültenlerini kontrol et
        if: env.EGM == 'true'
        run: node scripts/egm-guncelle.mjs

      - name: İBB verisini kontrol et
        if: env.IBB == 'true'
        run: node scripts/ibb-guncelle.mjs

      - name: İzmir verisini kontrol et
        if: env.IZMIR == 'true'
        run: node scripts/izmir-guncelle.mjs

      - name: Açık veri dosyalarını üret
        run: node scripts/acik-veri.mjs

      - name: Doğrulama testleri
        run: npm test

      - name: Değişiklik varsa commit at ve siteyi yeniden yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain server/data acik-veri)" ]; then
            echo "Yeni veri yok."
            exit 0
          fi
          yeni=$(git status --porcelain server/data/egm | grep '^??' | sed -E 's#.*/([0-9]{4}-[0-9]{2})\.json#\1#' | tr '\n' ' ' | xargs)
          if [ -n "$yeni" ]; then mesaj="Veri: yeni EGM bülteni ($yeni)"; else mesaj="Veri: kaynak güncellemesi"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data acik-veri
          git commit -m "$mesaj"
          git push
          echo "### $mesaj" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run pages.yml --ref main

      - name: Hata olursa issue aç
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baslik="Otomatik veri güncellemesi başarısız"
          if gh issue list --state open --search "$baslik in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Açık issue zaten var."
            exit 0
          fi
          gh issue create --title "$baslik" --body "Veri güncelleme iş akışı hata verdi: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Olası nedenler:
          - EGM bülten PDF'inin biçimi değişti (ayrıştırıcı ya da toplam doğrulaması başarısız)
          - trafik.gov.tr ya da data.ibb.gov.tr geçici olarak erişilemiyor

          Yerelde denemek için: \`npm run veri:egm\`"
